# =============================================================================
# GRAFANA DATASOURCES - VEGA Monitoring
# =============================================================================
# Auto-provisioned datasources for Grafana
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://vega-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: "traceID"
          matcherRegex: "traceID=(\\w+)"
          url: "http://jaeger:16686/trace/$${__value.raw}"
          datasourceUid: "jaeger"

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: vega-postgres:5432
    database: vega
    user: vega
    secureJsonData:
      password: "${POSTGRES_PASSWORD}"
    jsonData:
      sslmode: "disable"
      postgresVersion: 1600
      timescaledb: false

  - name: Neo4j
    type: grafana-neo4j-datasource
    access: proxy
    url: bolt://vega-neo4j:7687
    database: neo4j
    user: neo4j
    secureJsonData:
      password: "${NEO4J_PASSWORD}"
    jsonData:
      maxConcurrentQueries: 10

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false